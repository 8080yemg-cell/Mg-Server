name: Build Native Mg Server APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android SDK Packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/tools/bin
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Native Android Project (API 19 to 34)
        run: |
          mkdir -p MgServerProject/app/src/main/java/com/magai/mgserver
          mkdir -p MgServerProject/app/src/main/res/layout
          mkdir -p MgServerProject/app/src/main/res/values
          mkdir -p MgServerProject/app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > MgServerProject/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF

          cat << 'EOF' > MgServerProject/settings.gradle
          rootProject.name = "MgServer"
          include ':app'
          EOF

          cat << 'EOF' > MgServerProject/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > MgServerProject/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.magai.mgserver'
              compileSdk 34

              defaultConfig {
                  applicationId "com.magai.mgserver"
                  minSdk 19
                  targetSdk 34
                  versionCode 16
                  versionName "0.1.16"
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF

          cat << 'EOF' > MgServerProject/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Mg Server</string>
          </resources>
          EOF

          cat << 'EOF' > MgServerProject/app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#E50914</item>
                  <item name="colorPrimaryDark">#0B0C10</item>
                  <item name="colorAccent">#E50914</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > MgServerProject/app/src/main/res/values/colors.xml
          <resources>
              <color name="ic_launcher_bg">#081426</color>
          </resources>
          EOF

          cat << 'EOF' > MgServerProject/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_bg" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > MgServerProject/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_bg" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > MgServerProject/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" tools:targetApi="33" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" tools:targetApi="33" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" tools:targetApi="33" />

              <application
                  android:allowBackup="true"
                  android:requestLegacyExternalStorage="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > MgServerProject/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0B0C10"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Mg Server v0.1.16 — Mag"
                      android:textColor="#FFFFFF"
                      android:textSize="22sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:text="الحالة: متوقف"
                      android:textColor="#FF6B72"
                      android:textSize="14sp" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:text="عنوان IP المرجعي / الشبكة (قابل للتعديل)"
                      android:textColor="#C5CADB"
                      android:textSize="13sp" />

                  <EditText
                      android:id="@+id/etIp"
                      android:layout_width="match_parent"
                      android:layout_height="46dp"
                      android:layout_marginTop="4dp"
                      android:background="#161922"
                      android:hint="192.168.1.222"
                      android:inputType="text"
                      android:padding="10dp"
                      android:textColor="#FFFFFF"
                      android:textColorHint="#6E748A" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:text="المنفذ (Port)"
                      android:textColor="#C5CADB"
                      android:textSize="13sp" />

                  <EditText
                      android:id="@+id/etPort"
                      android:layout_width="match_parent"
                      android:layout_height="46dp"
                      android:layout_marginTop="4dp"
                      android:background="#161922"
                      android:hint="8080"
                      android:inputType="number"
                      android:padding="10dp"
                      android:textColor="#FFFFFF"
                      android:textColorHint="#6E748A" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:text="كلمة المرور (اتركها فارغة للدخول المباشر)"
