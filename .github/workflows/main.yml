          </ScrollView>
          EOF

          cat << 'EOF' > MgServerProject/app/src/main/java/com/magai/mgserver/MainActivity.java
          package com.magai.mgserver;

          import android.Manifest;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.io.BufferedInputStream;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.io.PrintWriter;
          import java.net.Inet4Address;
          import java.net.InetAddress;
          import java.net.InetSocketAddress;
          import java.net.NetworkInterface;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.net.URLDecoder;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.UUID;

          public class MainActivity extends AppCompatActivity {

              private static final String APP_VERSION = "0.1.16";
              private static final String DEFAULT_IP = "192.168.1.222";
              private static final String SESSION_COOKIE_NAME = "mg_session";

              private EditText etIp, etPort, etPassword, etFolder;
              private TextView tvStatus, tvSummary;
              private SharedPreferences prefs;

              private ServerSocket serverSocket;
              private Thread serverThread;
              private volatile boolean running = false;
              private volatile String activeSessionToken = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  prefs = getSharedPreferences("mg_server_prefs", MODE_PRIVATE);

                  etIp = findViewById(R.id.etIp);
                  etPort = findViewById(R.id.etPort);
                  etPassword = findViewById(R.id.etPassword);
                  etFolder = findViewById(R.id.etFolder);
                  tvStatus = findViewById(R.id.tvStatus);
                  tvSummary = findViewById(R.id.tvSummary);

                  Button btnSaveUpdate = findViewById(R.id.btnSaveUpdate);
                  Button btnStart = findViewById(R.id.btnStart);
                  Button btnStop = findViewById(R.id.btnStop);
                  Button btnLogoutSession = findViewById(R.id.btnLogoutSession);

                  String defaultDir = new File(Environment.getExternalStorageDirectory(), "MG Server").getAbsolutePath();

                  etIp.setText(prefs.getString("ip", DEFAULT_IP));
                  etPort.setText(prefs.getString("port", "8080"));
                  etPassword.setText(prefs.getString("password", ""));
                  etFolder.setText(prefs.getString("folder", defaultDir));

                  syncSessionState();
                  requestStorageIfNeeded();
                  ensureRootAndIndex();
                  refreshSummary();

                  btnSaveUpdate.setOnClickListener(v -> {
                      requestStorageIfNeeded();
                      saveConfig();
                      syncSessionState();
                      boolean ok = ensureRootAndIndex();
                      refreshSummary();
                      tvStatus.setText(ok ? "الحالة: تم حفظ الإعدادات وتحديث الفهرس" : "الحالة: تعذر إنشاء مجلد MG Server — تحقق من صلاحية التخزين");
                      tvStatus.setTextColor(ok ? 0xFF38BDF8 : 0xFFFF6B72);
                      if (running) {
                          stopServer();
                          startServer();
                      }
                  });

                  btnStart.setOnClickListener(v -> {
                      requestStorageIfNeeded();
                      saveConfig();
                      syncSessionState();
                      ensureRootAndIndex();
                      startServer();
                      refreshSummary();
                  });

                  btnStop.setOnClickListener(v -> {
                      stopServer();
                      refreshSummary();
                  });

                  btnLogoutSession.setOnClickListener(v -> {
                      clearActiveSession();
                      refreshSummary();
                      tvStatus.setText("الحالة: تم تسجيل الخروج وإنهاء الجلسة");
                      tvStatus.setTextColor(0xFFFACC15);
                  });
              }

              private void syncSessionState() {
                  String pass = etPassword.getText().toString();
                  if (pass.isEmpty()) {
                      activeSessionToken = null;
                  } else if (activeSessionToken == null) {
                      activeSessionToken = UUID.randomUUID().toString();
                  }
              }

              private void clearActiveSession() {
                  String pass = etPassword.getText().toString();
                  activeSessionToken = pass.isEmpty() ? null : UUID.randomUUID().toString();
              }

              private boolean isPasswordEnabled() {
                  return !etPassword.getText().toString().isEmpty();
              }

              private boolean hasValidSessionCookie(String cookieHeader) {
                  if (!isPasswordEnabled()) return true;
                  if (activeSessionToken == null || cookieHeader == null) return false;
                  String[] parts = cookieHeader.split(";");
                  for (String p : parts) {
                      String trimmed = p.trim();
                      if (trimmed.equals(SESSION_COOKIE_NAME + "=" + activeSessionToken)) {
                          return true;
                      }
                  }
                  return false;
              }

              private void requestStorageIfNeeded() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          try {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                              intent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(intent);
                          } catch (Exception ignored) {}
                      }
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED
                              || ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{
                                  Manifest.permission.READ_EXTERNAL_STORAGE,
                                  Manifest.permission.WRITE_EXTERNAL_STORAGE
                          }, 101);
                      }
                  }
              }

              private List<String> detectAllLocalIps() {
                  Set<String> found = new LinkedHashSet<>();
                  List<String> ordered = new ArrayList<>();
                  try {
                      for (NetworkInterface nif : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!nif.isUp() || nif.isLoopback()) continue;
                          for (InetAddress addr : Collections.list(nif.getInetAddresses())) {
                              if (!addr.isLoopbackAddress() && addr instanceof Inet4Address) {
                                  String ip = addr.getHostAddress();
                                  if (ip != null && found.add(ip)) {
                                      if (ip.startsWith("192.168.")) {
                                          ordered.add(0, ip);
                                      } else {
                                          ordered.add(ip);
                                      }
                                  }
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return ordered;
              }

              private void saveConfig() {
                  String ipVal = etIp.getText().toString().trim();
                  if (ipVal.isEmpty()) ipVal = DEFAULT_IP;
                  prefs.edit()
                          .putString("ip", ipVal)
                          .putString("port", etPort.getText().toString().trim())
                          .putString("password", etPassword.getText().toString())
                          .putString("folder", etFolder.getText().toString().trim())
                          .apply();
              }

              private File getRootDir() {
                  String path = etFolder.getText().toString().trim();
                  if (path.isEmpty()) {
                      path = new File(Environment.getExternalStorageDirectory(), "MG Server").getAbsolutePath();
                  }
                  return new File(path);
              }

              private boolean ensureRootAndIndex() {
                  try {
                      File root = getRootDir();
                      if (!root.exists() && !root.mkdirs()) {
                          return false;
                      }
                      String html = buildDirectoryPageHtml(root, "", false);
                      File outFile = new File(root, "index.html");
                      try (FileOutputStream fos = new FileOutputStream(outFile)) {
                          fos.write(html.getBytes(StandardCharsets.UTF_8));
                      }
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private String buildApiMediaJson(File dir, String relPath) {
                  try {
                      File[] files = dir.listFiles();
                      List<String> foldersJson = new ArrayList<>();
                      List<String> itemsJson = new ArrayList<>();
                      String basePrefix = relPath.isEmpty() ? "" : (encodeRel(relPath) + "/");

                      if (files != null) {
                          for (File f : files) {
                              if (f.getName().equals("index.html")) continue;
                              String name = f.getName();
                              if (f.isDirectory()) {
                                  String href = "/" + basePrefix + URLEncoder.encode(name, "UTF-8") + "/";
                                  foldersJson.add("{\"name\":\"" + escapeJson(name) + "\",\"path\":\"" + escapeJson(href) + "\",\"type\":\"folder\"}");
                              } else {
                                  String lower = name.toLowerCase(Locale.ROOT);
                                  String type = "file";
                                  if (lower.endsWith(".mp4") || lower.endsWith(".mkv") || lower.endsWith(".webm") || lower.endsWith(".3gp")) {
                                      type = "video";
                                  } else if (lower.endsWith(".mp3") || lower.endsWith(".m4a") || lower.endsWith(".wav") || lower.endsWith(".ogg")) {
                                      type = "audio";
                                  } else if (lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".png") || lower.endsWith(".webp")) {
                                      type = "image";
                                  } else if (lower.endsWith(".pdf")) {
                                      type = "pdf";
                                  } else if (lower.endsWith(".apk")) {
                                      type = "apk";
                                  }
                                  String url = "/" + basePrefix + URLEncoder.encode(name, "UTF-8");
                                  itemsJson.add("{\"name\":\"" + escapeJson(name) + "\",\"url\":\"" + escapeJson(url) + "\",\"type\":\"" + type + "\",\"size\":" + f.length() + "}");
                              }
                          }
                      }

                      return "{\"server\":\"Mg Server v" + APP_VERSION + "\",\"path\":\"/" + escapeJson(relPath)
                           + "\",\"folders\":[" + String.join(",", foldersJson)
                           + "],\"items\":[" + String.join(",", itemsJson) + "]}";
                  } catch (Exception e) {
                      return "{\"folders\":[],\"items\":[]}";
                  }
              }

              private String buildDirectoryPageHtml(File dir, String relPath, boolean unlockedInSession) {
                  try {
                      String ip = etIp.getText().toString().trim();
                      if (ip.isEmpty()) ip = DEFAULT_IP;
                      String port = etPort.getText().toString().trim();
                      String pass = etPassword.getText().toString();

                      File[] files = dir.listFiles();
                      List<File> folders = new ArrayList<>();
                      List<File> videos = new ArrayList<>();
                      List<File> audios = new ArrayList<>();
                      List<File> images = new ArrayList<>();
                      List<File> pdfs = new ArrayList<>();
                      List<File> apks = new ArrayList<>();

                      if (files != null) {
                          for (File f : files) {
                              if (f.getName().equals("index.html")) continue;
                              if (f.isDirectory()) {
                                  folders.add(f);
                              } else {
                                  String lower = f.getName().toLowerCase(Locale.ROOT);
                                  if (lower.endsWith(".mp4") || lower.endsWith(".mkv") || lower.endsWith(".webm") || lower.endsWith(".3gp")) {
                                      videos.add(f);
                                  } else if (lower.endsWith(".mp3") || lower.endsWith(".m4a") || lower.endsWith(".wav") || lower.endsWith(".ogg")) {
                                      audios.add(f);
                                  } else if (lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".png") || lower.endsWith(".webp")) {
                                      images.add(f);
                                  } else if (lower.endsWith(".pdf")) {
                                      pdfs.add(f);
                                  } else if (lower.endsWith(".apk")) {
                                      apks.add(f);
                                  }
                              }
                          }
                      }

                      String basePrefix = relPath.isEmpty() ? "" : (encodeRel(relPath) + "/");

                      StringBuilder folderCards = new StringBuilder();
                      if (!relPath.isEmpty()) {
                          String parentRel = "";
                          int idx = relPath.lastIndexOf('/');
                          if (idx > 0) parentRel = relPath.substring(0, idx);
                          String backHref = parentRel.isEmpty() ? "/" : ("/" + encodeRel(parentRel) + "/");
                          folderCards.append("<a class='card back-card' href='").append(backHref).append("'>⬅️ العودة للخلف</a>\n");
                      }
                      for (File d : folders) {
                          String href = "/" + basePrefix + URLEncoder.encode(d.getName(), "UTF-8") + "/";
                          folderCards.append("<a class='card folder-card' href='").append(href).append("'>📁 <span>")
                                     .append(escapeHtml(d.getName())).append("</span></a>\n");
                      }

                      StringBuilder videoCards = new StringBuilder();
                      for (File v : videos) {
                          String src = "/" + basePrefix + URLEncoder.encode(v.getName(), "UTF-8");
                          videoCards.append("<div class='card media-card'>🎬 <div class='title'>").append(escapeHtml(v.getName()))
                                    .append("</div><video controls preload='metadata' playsinline src='").append(src).append("'></video></div>\n");
                      }

                      StringBuilder audioCards = new StringBuilder();
                      for (File a : audios) {
                          String src = "/" + basePrefix + URLEncoder.encode(a.getName(), "UTF-8");
                          audioCards.append("<div class='card media-card'>🎵 <div class='title'>").append(escapeHtml(a.getName()))
                                    .append("</div><audio controls preload='metadata' src='").append(src).append("'></audio></div>\n");
                      }

                      StringBuilder imageCards = new StringBuilder();
                      for (File img : images) {
                          String src = "/" + basePrefix + URLEncoder.encode(img.getName(), "UTF-8");
