              private String renderSection(String cat, String heading, String content) {
                  if (content == null || content.trim().isEmpty()) return "";
                  return "<section class='sec' data-cat='" + cat + "'><div class='sec-head'><h3>" + heading + "</h3></div><div class='grid'>" + content + "</div></section>\n";
              }

              private String encodeRel(String rel) throws Exception {
                  String[] parts = rel.split("/");
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < parts.length; i++) {
                      if (parts[i].isEmpty()) continue;
                      if (sb.length() > 0) sb.append("/");
                      sb.append(URLEncoder.encode(parts[i], "UTF-8"));
                  }
                  return sb.toString();
              }

              private String escapeHtml(String s) {
                  return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;");
              }

              private String escapeJs(String s) {
                  return s.replace("\\", "\\\\").replace("'", "\\'");
              }

              private String escapeJson(String s) {
                  return s.replace("\\", "\\\\").replace("\"", "\\\"").replace("\n", "\\n").replace("\r", "");
              }

              private String extractJsonPassword(String rawBody) {
                  if (rawBody == null) return "";
                  int idx = rawBody.indexOf("\"password\"");
                  if (idx < 0) return "";
                  int colon = rawBody.indexOf(':', idx);
                  if (colon < 0) return "";
                  int firstQuote = rawBody.indexOf('"', colon + 1);
                  if (firstQuote < 0) return "";
                  StringBuilder sb = new StringBuilder();
                  for (int i = firstQuote + 1; i < rawBody.length(); i++) {
                      char c = rawBody.charAt(i);
                      if (c == '\\' && i + 1 < rawBody.length()) {
                          i++;
                          sb.append(rawBody.charAt(i));
                      } else if (c == '"') {
                          break;
                      } else {
                          sb.append(c);
                      }
                  }
                  return sb.toString();
              }

              private void refreshSummary() {
                  String ip = etIp.getText().toString().trim();
                  if (ip.isEmpty()) ip = DEFAULT_IP;
                  String port = etPort.getText().toString().trim();
                  String folder = getRootDir().getAbsolutePath();
                  String passState = etPassword.getText().toString().isEmpty() ? "بدون كلمة مرور" : "محمي بكلمة مرور (جلسة حتى الخروج)";
                  List<String> allIps = detectAllLocalIps();
                  String ipsText = allIps.isEmpty() ? ip : String.join(" , ", allIps);
                  tvSummary.setText("الإصدار: v" + APP_VERSION + "\nالرابط: http://" + ip + ":" + port + "\nعناوين IP المتاحة: " + ipsText + "\nالمجلد الرئيسي: " + folder + "\nالحماية: " + passState);
              }

              private void startServer() {
                  if (running) return;
                  syncSessionState();
                  int port = 8080;
                  try {
                      port = Integer.parseInt(etPort.getText().toString().trim());
                  } catch (Exception ignored) {}

                  final int bindPort = port;
                  running = true;
                  tvStatus.setText("الحالة: يعمل على 0.0.0.0:" + bindPort);
                  tvStatus.setTextColor(0xFF4ADE80);

                  serverThread = new Thread(() -> {
                      try {
                          serverSocket = new ServerSocket();
                          serverSocket.setReuseAddress(true);
                          serverSocket.bind(new InetSocketAddress("0.0.0.0", bindPort));
                          while (running) {
                              Socket client = serverSocket.accept();
                              new Thread(() -> handleClient(client)).start();
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              tvStatus.setText("الحالة: متوقف");
                              tvStatus.setTextColor(0xFFFF6B72);
                          });
                      }
                  });
                  serverThread.start();
              }

              private void stopServer() {
                  running = false;
                  clearActiveSession();
                  try {
                      if (serverSocket != null) serverSocket.close();
                  } catch (Exception ignored) {}
                  tvStatus.setText("الحالة: متوقف");
                  tvStatus.setTextColor(0xFFFF6B72);
              }

              private void handleClient(Socket client) {
                  try (Socket s = client;
                       BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream()));
                       OutputStream out = s.getOutputStream()) {

                      String reqLine = in.readLine();
                      if (reqLine == null) return;
                      String[] reqParts = reqLine.split(" ");
                      if (reqParts.length < 2) return;
                      String method = reqParts[0];
                      if (!method.equals("GET") && !method.equals("POST")) return;

                      String rangeHeader = null;
                      String cookieHeader = null;
                      int contentLength = 0;
                      String line;
                      while ((line = in.readLine()) != null && !line.isEmpty()) {
                          String lowerLine = line.toLowerCase(Locale.ROOT);
                          if (lowerLine.startsWith("range:")) {
                              rangeHeader = line.substring(6).trim();
                          } else if (lowerLine.startsWith("cookie:")) {
                              cookieHeader = line.substring(7).trim();
                          } else if (lowerLine.startsWith("content-length:")) {
                              try {
                                  contentLength = Integer.parseInt(line.substring(15).trim());
                              } catch (Exception ignored) {}
                          }
                      }

                      String rawRequest = reqParts[1];
                      String pathPart = rawRequest.split("\\?")[0];
                      String cleanPath = URLDecoder.decode(pathPart, "UTF-8");

                      if (cleanPath.equals("/api/auth/login") && method.equals("POST")) {
                          char[] buf = new char[Math.max(0, Math.min(contentLength, 4096))];
                          int readTotal = 0;
                          while (readTotal < buf.length) {
                              int r = in.read(buf, readTotal, buf.length - readTotal);
                              if (r < 0) break;
                              readTotal += r;
                          }
                          String bodyStr = new String(buf, 0, readTotal);
                          String suppliedPass = extractJsonPassword(bodyStr);
                          String configuredPass = etPassword.getText().toString();

                          if (configuredPass.isEmpty() || configuredPass.equals(suppliedPass)) {
                              if (!configuredPass.isEmpty() && activeSessionToken == null) {
                                  activeSessionToken = UUID.randomUUID().toString();
                              }
                              String cookieLine = activeSessionToken != null
                                      ? ("Set-Cookie: " + SESSION_COOKIE_NAME + "=" + activeSessionToken + "; Path=/; HttpOnly; SameSite=Lax\r\n")
                                      : "";
                              byte[] okBody = "{\"ok\":true}".getBytes(StandardCharsets.UTF_8);
                              PrintWriter pw = new PrintWriter(out, false);
                              pw.print("HTTP/1.1 200 OK\r\nContent-Type: application/json; charset=utf-8\r\n"
                                     + cookieLine
                                     + "Cache-Control: no-store\r\nContent-Length: " + okBody.length + "\r\nConnection: close\r\n\r\n");
                              pw.flush();
                              out.write(okBody);
                              out.flush();
                          } else {
                              byte[] errBody = "{\"ok\":false}".getBytes(StandardCharsets.UTF_8);
                              PrintWriter pw = new PrintWriter(out, false);
                              pw.print("HTTP/1.1 401 Unauthorized\r\nContent-Type: application/json; charset=utf-8\r\n"
                                     + "Cache-Control: no-store\r\nContent-Length: " + errBody.length + "\r\nConnection: close\r\n\r\n");
                              pw.flush();
                              out.write(errBody);
                              out.flush();
                          }
                          return;
                      }

                      if (cleanPath.equals("/api/auth/logout") && method.equals("POST")) {
                          clearActiveSession();
                          byte[] outBody = "{\"ok\":true}".getBytes(StandardCharsets.UTF_8);
                          PrintWriter pw = new PrintWriter(out, false);
                          pw.print("HTTP/1.1 200 OK\r\nContent-Type: application/json; charset=utf-8\r\n"
                                 + "Set-Cookie: " + SESSION_COOKIE_NAME + "=; Path=/; Max-Age=0\r\n"
                                 + "Cache-Control: no-store\r\nContent-Length: " + outBody.length + "\r\nConnection: close\r\n\r\n");
                          pw.flush();
                          out.write(outBody);
                          out.flush();
                          return;
                      }

                      if (!method.equals("GET")) return;

                      boolean unlocked = hasValidSessionCookie(cookieHeader);

                      File root = getRootDir();
                      if (!root.exists()) root.mkdirs();

                      if (cleanPath.equals("/api/media") || cleanPath.equals("/api/index")) {
                          if (!unlocked) {
                              byte[] lockJson = "{\"locked\":true,\"folders\":[],\"items\":[]}".getBytes(StandardCharsets.UTF_8);
                              PrintWriter pw = new PrintWriter(out, false);
                              pw.print("HTTP/1.1 401 Unauthorized\r\nContent-Type: application/json; charset=utf-8\r\nCache-Control: no-store\r\nContent-Length: " + lockJson.length + "\r\nConnection: close\r\n\r\n");
                              pw.flush();
                              out.write(lockJson);
                              out.flush();
                              return;
                          }
                          String subQuery = "";
                          if (rawRequest.contains("?")) {
                              String q = rawRequest.substring(rawRequest.indexOf('?') + 1);
                              for (String param : q.split("&")) {
                                  if (param.startsWith("path=") || param.startsWith("dir=")) {
                                      subQuery = URLDecoder.decode(param.substring(param.indexOf('=') + 1), "UTF-8");
                                  }
                              }
                          }
                          String subRel = subQuery.replaceFirst("^/+", "").replace("..", "").replaceAll("/+$", "");
                          File targetDir = subRel.isEmpty() ? root : new File(root, subRel);
                          if (!targetDir.exists() || !targetDir.isDirectory()) targetDir = root;
                          String json = buildApiMediaJson(targetDir, subRel);
                          byte[] body = json.getBytes(StandardCharsets.UTF_8);
                          PrintWriter pw = new PrintWriter(out, false);
                          pw.print("HTTP/1.1 200 OK\r\nContent-Type: application/json; charset=utf-8\r\nAccess-Control-Allow-Origin: *\r\nCache-Control: no-store\r\nContent-Length: " + body.length + "\r\nConnection: close\r\n\r\n");
                          pw.flush();
                          out.write(body);
                          out.flush();
                          return;
                      }

                      String rel = cleanPath.replaceFirst("^/+", "").replace("..", "").replaceAll("/+$", "");
                      File target = rel.isEmpty() ? root : new File(root, rel);

                      if (!target.exists()) {
                          String notFound = "<h1>404 - غير موجود</h1>";
                          byte[] body = notFound.getBytes(StandardCharsets.UTF_8);
                          PrintWriter pw = new PrintWriter(out, false);
                          pw.print("HTTP/1.1 404 Not Found\r\nContent-Type: text/html; charset=utf-8\r\nCache-Control: no-store\r\nContent-Length: " + body.length + "\r\nConnection: close\r\n\r\n");
                          pw.flush();
                          out.write(body);
                          out.flush();
                          return;
                      }

                      if (target.isDirectory()) {
                          String html = buildDirectoryPageHtml(target, rel, unlocked);
                          byte[] body = html.getBytes(StandardCharsets.UTF_8);
                          PrintWriter pw = new PrintWriter(out, false);
                          pw.print("HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nCache-Control: no-store, no-cache, must-revalidate\r\nContent-Length: " + body.length + "\r\nConnection: close\r\n\r\n");
                          pw.flush();
                          out.write(body);
                          out.flush();
                          return;
                      }

                      if (!unlocked) {
                          byte[] unauth = "<h1>401 - يتطلب تسجيل الدخول</h1>".getBytes(StandardCharsets.UTF_8);
                          PrintWriter pw = new PrintWriter(out, false);
                          pw.print("HTTP/1.1 401 Unauthorized\r\nContent-Type: text/html; charset=utf-8\r\nCache-Control: no-store\r\nContent-Length: " + unauth.length + "\r\nConnection: close\r\n\r\n");
                          pw.flush();
                          out.write(unauth);
                          out.flush();
                          return;
                      }

                      String mime = guessMime(target.getName());
                      long totalLen = target.length();
                      long start = 0;
                      long end = totalLen - 1;
                      boolean isPartial = false;

                      if (rangeHeader != null && rangeHeader.startsWith("bytes=") && totalLen > 0) {
                          String spec = rangeHeader.substring(6).split(",")[0].trim();
                          String[] bounds = spec.split("-", 2);
                          try {
                              if (!bounds[0].isEmpty()) {
                                  start = Long.parseLong(bounds[0].trim());
                              }
                              if (bounds.length > 1 && !bounds[1].isEmpty()) {
                                  end = Long.parseLong(bounds[1].trim());
                              }
                              if (bounds[0].isEmpty() && bounds.length > 1 && !bounds[1].isEmpty()) {
                                  long suffix = Long.parseLong(bounds[1].trim());
                                  start = Math.max(0, totalLen - suffix);
                                  end = totalLen - 1;
                              }
                              if (start < 0) start = 0;
                              if (end >= totalLen) end = totalLen - 1;
                              if (start <= end) {
                                  isPartial = true;
                              }
                          } catch (Exception ignored) {}
                      }

                      long contentLen = isPartial ? (end - start + 1) : totalLen;
                      PrintWriter pw = new PrintWriter(out, false);
                      if (isPartial) {
                          pw.print("HTTP/1.1 206 Partial Content\r\nContent-Type: " + mime
                                 + "\r\nAccept-Ranges: bytes\r\nContent-Range: bytes " + start + "-" + end + "/" + totalLen
                                 + "\r\nContent-Length: " + contentLen + "\r\nConnection: close\r\n\r\n");
                      } else {
                          pw.print("HTTP/1.1 200 OK\r\nContent-Type: " + mime
                                 + "\r\nAccept-Ranges: bytes\r\nContent-Length: " + contentLen + "\r\nConnection: close\r\n\r\n");
                      }
                      pw.flush();

                      try (BufferedInputStream bis = new BufferedInputStream(new FileInputStream(target))) {
                          long skipped = 0;
                          while (skipped < start) {
                              long sCount = bis.skip(start - skipped);
                              if (sCount <= 0) break;
                              skipped += sCount;
                          }
                          byte[] buf = new byte[16384];
                          long remaining = contentLen;
                          int n;
                          while (remaining > 0 && (n = bis.read(buf, 0, (int) Math.min(buf.length, remaining))) != -1) {
                              out.write(buf, 0, n);
                              remaining -= n;
                          }
                          out.flush();
                      }
                  } catch (Exception ignored) {}
              }

              private String guessMime(String name) {
                  String l = name.toLowerCase(Locale.ROOT);
                  if (l.endsWith(".html") || l.endsWith(".htm")) return "text/html; charset=utf-8";
                  if (l.endsWith(".apk")) return "application/vnd.android.package-archive";
                  if (l.endsWith(".pdf")) return "application/pdf";
                  if (l.endsWith(".mp4")) return "video/mp4";
                  if (l.endsWith(".mkv")) return "video/x-matroska";
                  if (l.endsWith(".webm")) return "video/webm";
                  if (l.endsWith(".mp3")) return "audio/mpeg";
                  if (l.endsWith(".m4a")) return "audio/mp4";
                  if (l.endsWith(".jpg") || l.endsWith(".jpeg")) return "image/jpeg";
                  if (l.endsWith(".png")) return "image/png";
                  if (l.endsWith(".webp")) return "image/webp";
                  return "application/octet-stream";
              }

              @Override
              protected void onDestroy() {
                  stopServer();
                  super.onDestroy();
              }
          }
          EOF

