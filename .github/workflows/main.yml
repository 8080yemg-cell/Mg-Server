                           + "document.querySelectorAll('.sec').forEach(s=>{s.style.display=(cat==='all'||s.dataset.cat===cat)?'block':'none';});}"
                           + "function submitSessionLogin(){const v=document.getElementById('pw').value;fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:v})}).then(r=>{if(r.ok){window.location.reload();}else{alert('كلمة المرور غير صحيحة');}});}"
                           + "function doWebLogout(){fetch('/api/auth/logout',{method:'POST'}).then(()=>{window.location.reload();});}"
